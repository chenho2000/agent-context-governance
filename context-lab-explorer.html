entation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implementation\n# legacy implem One history, several representations", "pages": "1–2, 11", "question": "What are we actually trying to make smaller?", "thesis": "The article surveys mechanisms at different layers. The common objective is reliable progress within finite context and cost, not the smallest possible transcript.", "stages": [{"title": "Record", "explanation": "Assign an object ID and preserve what was observed before making lossy transformations. A file path alone does not identify a particular historical read.", "input": "User requirement or tool result", "output": "Immutable object, version and source identity"}, {"title": "Project", "explanation": "Choose how this object will appear in a request. Folding and hiding are display choices; neither means the original database row must be deleted.", "input": "Raw object plus current view state", "output": "Full body, reference, permitted partial body or omission"}, {"title": "Derive", "explanation": "Facts and summaries create additional representations with source references. They help future retrieval, but are not replacements for the original evidence.", "input": "Source-supported observations", "output": "Structured facts, turn summaries or index nodes"}, {"title": "Use", "explanation": "A model sees only the assembled request. Evidence can be stored but not found, found but not sent, or sent but misunderstood.", "input": "Protected context plus selected evidence", "output": "A bounded request; answer quality still requires evaluation"}], "correction": "The article contrasts destructive Self-GC with non-destructive DCP too broadly. The supplied Self-GC paper also retains a transcript outside the active view. Recovery availability, visible history and raw storage are separate properties.", "modules": ["types.py · object identities", "store.py · raw data and derived state", "projection.py · model-facing messages"], "fields": ["objects", "sizes"], "view": "objects", "coverage_ids": ["objects", "non-destructive", "sidecar"]}, {"id": "gc", "title": "Self-GC: decide what is still needed", "pages": "2–3", "question": "Which past objects must remain usable?", "thesis": "GC asks about task dependencies before asking how to shorten text. A small constraint can matter more than a huge background document.", "stages": [{"title": "Mark roots", "explanation": "Begin with the current task, unresolved requirements, protected records and explicit dependencies. Follow references to necessary earlier evidence.", "input": "Task roots and dependency edges", "output": "A conservative set of live objects"}, {"title": "Propose actions", "explanation": "The six-step planner excludes unsafe targets, examines direct and bridge dependencies, checks obsolescence, chooses granularity, selects actions and calibrates the whole plan.", "input": "A versioned snapshot", "output": "A proposal using keep, fold, mask, prune or distill"}, {"title": "Rehearse", "explanation": "The executor validates the proposal independently. User objects have restricted actions; exact-now material, tool protocols and sparse evidence receive stronger protection.", "input": "Candidate actions", "output": "A validated candidate view, or a precise rejection"}, {"title": "Commit or wait", "explanation": "Save a pending plan, then recheck identity, revision, busy state, capacity and cost in the commit path. A pending candidate may survive restart; unfinished model generation does not.", "input": "Persisted candidate plus current state", "output": "Atomic view change, deferral or stale-plan rejection"}], "correction": "A dependency closure is only as complete as the supplied edges. Fold restores archived text when called, but cannot prove the model will know when to call it. Masking arbitrary middle content is unsafe; binary media recovery is not implemented here.", "modules": ["planning.py · recommendations", "governance.py · rehearsal and authority", "runtime.py · scheduling", "store.py · transaction and recovery"], "fields": ["events", "negative_cases", "deferred", "resumed"], "view": "timeline", "coverage_ids": ["mark", "planner", "async", "actions", "mask", "media", "instruction-audit"]}, {"id": "prism", "title": "PRISM: retrieve through structure", "pages": "3–4", "question": "How do we select evidence for this question?", "thesis": "Entity → FacetPoint → Facet → Episode gives retrieval a meaningful hierarchy. Typed relations let temporal and causal questions prefer different routes.", "stages": [{"title": "Identify intent", "explanation": "The local router tries keywords and prototype vectors, with an optional model path. Intent is an input to retrieval, not a guarantee that the resulting answer is correct.", "input": "A query such as “why did the plan change?”", "output": "An intent and entry candidates"}, {"title": "Walk typed paths", "explanation": "Search the small hierarchy using positive edge costs. Query-sensitive costs favor relevant relation types; a temporal question and causal question can rank paths differently.", "input": "Hierarchy, typed edges and intent", "output": "Episode candidates with recorded paths and costs"}, {"title": "Select content", "explanation": "N3 ranks episode content and selects complete evidence within a body budget. The local default is BM25, with optional model reranking.", "input": "Candidate episode text", "output": "Budgeted retrieval evidence"}, {"title": "Pack the request", "explanation": "Recheck the serialized request including protected context, question, source labels and output reserve. Skip oversized whole evidence and try later candidates.", "input": "Ranked evidence and total capacity", "output": "Actually sent IDs, omitted IDs and explicit reasons"}], "correction": "The article describes PRISM as retrieval replacing compression and omits N3. The supplied paper combines retrieval with content selection/compression. Keeping all storage does not prevent retrieval misses. The local search and budget policy are teaching implementations, not official benchmark replication.", "modules": ["retrieval.py · N1–N4", "fusion.py · episodes contain objects", "evidence.py · full-request packing"], "fields": ["prism_ablations", "retrieved", "retrieve_first", "packing", "packing_candidates"], "view": "retrieval", "coverage_ids": ["prism-n1", "prism-n2", "prism-n3", "prism-n4", "fusion", "retrieval-tune"]}, {"id": "simplemem", "title": "SimpleMem: organize at write time", "pages": "4", "question": "What should an experience become before we store it as memory?", "thesis": "Write-time processing aims to create compact, self-contained facts that many future queries can reuse. Its value depends on future reads and extraction quality.", "stages": [{"title": "Gate a window", "explanation": "Collect a bounded group of observations. Skip clear low-information cases conservatively; do not equate semantic value with literal character entropy.", "input": "A window of source objects", "output": "A decision to process or skip"}, {"title": "Make facts self-contained", "explanation": "Extract atomic facts, bind explicit references and anchor relative dates. Offline examples consume annotations; optional models perform natural-language extraction.", "input": "Source text, bindings and date anchors", "output": "Entity, slot, value, date, text and source IDs"}, {"title": "Synthesize and correct", "explanation": "Merge equivalent canonical keys and union their sources. A correction can target a specific memory ID. A changed fact over time is not automatically a correction.", "input": "Existing facts plus new facts", "output": "Transactional updates; invalid targets and correction cycles rejected"}, {"title": "Read through three views", "explanation": "Retrieve by lexical content, vectors and symbolic fields; fuse rankings. The default hash vector is a lexical approximation, not neural semantic understanding.", "input": "Question and explicit filters", "output": "Ranked source-cited facts, or an honest empty result"}], "correction": "The supplied SimpleMem v3 uses online synthesis and intent-aware retrieval. The article’s mandatory two-clock attribution does not match that version. Sleep-time and cross-session pattern analysis are separate extensions here; field-key equivalence is not proof of semantic equivalence.", "modules": ["gating.py · conservative information gate", "memory.py · extraction and retrieval", "store.py · atomic memory windows"], "fields": ["simplemem", "memory_records", "surviving_memory_values", "gate"], "view": "memory", "coverage_ids": ["gating", "facts", "three-view", "synthesis", "memory-planner"]}, {"id": "memgpt", "title": "MemGPT / Letta: manage a working set", "pages": "4–5", "question": "How can a model operate with only a small working memory?", "thesis": "Core, Recall and Archival have different roles. The model can request memory operations through tools, while host code still enforces limits and scope.", "stages": [{"title": "Keep a small Core", "explanation": "Provide persistent named text blocks that fit the working-memory budget. Persistent does not mean eternally correct; updates remain necessary.", "input": "Current problem and Core blocks", "output": "The small state supplied to the model"}, {"title": "Page through Recall", "explanation": "Search historical messages and request bounded pages. The next model step sees the recent observation rather than automatically receiving the entire archive.", "input": "A search query and page number", "output": "A small result page plus a has-more signal"}, {"title": "Use the archive", "explanation": "Insert source-supported facts or query the explicitly configured archive. Cross-session access is chosen by the host, not invented by the model.", "input": "Allowed tools and source IDs", "output": "Audited memory operations"}, {"title": "Continue or yield", "explanation": "A heartbeat asks for another bounded step; an answer or a yield ends the current loop. SleepWorker can consolidate separately in a background thread.", "input": "Tool observation and continuation request", "output": "A bounded sequence, not an infinite autonomous loop"}], "correction": "The bundled demo uses ReplayModel to make the loop deterministic. It is not live inference. The implementation is a local memory-tool loop, not the complete MemGPT or Letta hosted product.", "modules": ["memgpt.py · MemoryAgent and SleepWorker", "memory.py · archive retrieval", "runtime.py · bound compression tool"], "fields": ["memgpt", "sleep_ids"], "view": "memory", "coverage_ids": ["memgpt", "self-edit", "sleep"]}, {"id": "compression", "title": "LLMLingua and the decision cascade", "pages": "5, 8–9", "question": "Which text operations deserve which amount of model work?", "thesis": "Token compression and object liveness are different judgments. Cheap rules can resolve exact repetition; uncertain semantic choices can use progressively more capable backends.", "stages": [{"title": "Try deterministic rules", "explanation": "Remove explicitly allowed format repetition or use an equivalent-read reference. Persist raw inputs first, and protect sparse exact evidence.", "input": "Eligible text or objects", "output": "A rule result with provenance"}, {"title": "Compress tokens when appropriate", "explanation": "LLMLingua uses a small-model scoring route; LongLLMLingua adds question-aware treatment; LLMLingua-2 uses token classification. These are optional upstream adapters here.", "input": "Text and optional question or rate", "output": "A compressed text candidate, not object-deletion authority"}, {"title": "Escalate unresolved cases", "explanation": "Object planning may try a generic NLI encoder, local summary model and full planner. No backend or insufficient confidence can lead to abstention.", "input": "An unresolved eligible object", "output": "Keep, recoverable fold or summary recommendation"}, {"title": "Validate before applying", "explanation": "The Governor checks object-level rules regardless of the suggesting backend. A high classifier score cannot override a live dependency or exact constraint.", "input": "Recommendation and task invariants", "output": "An accepted candidate or rejection"}], "correction": "LLMLingua-2 token scores do not constitute a trained Self-GC object classifier. The generic NLI adapter is also not such a classifier. No weights are downloaded by the default experiments, and no neural quality gains are inferred from adapter tests.", "modules": ["compression.py · text cascade", "planning.py · object cascade", "providers.py · optional backends", "governance.py · final permissions"], "fields": ["cascade", "tiered", "optional_neural_inference"], "view": "mechanisms", "coverage_ids": ["lingua1", "longlingua", "lingua2", "object-cascade", "encoder", "edge-cascade"]}, {"id": "cache", "title": "Prompt caching: reuse computation", "pages": "3, 5, 10–11, 15", "question": "Why can a smaller prompt be more expensive?", "thesis": "Exact prefix reuse makes editing position matter. Saving input units competes with rebuilding the changed suffix and with governance work itself.", "stages": [{"title": "Stabilize the prefix", "explanation": "Place stable material before changing material. Cache checkpoints cover prefixes, not isolated labels. Changing an earlier region affects later reusable prefixes.", "input": "Static, history, dynamic and recent zones", "output": "A measurable common prefix and changed suffix"}, {"title": "Separate two requests", "explanation": "Appending a compaction instruction can preserve the request used to ask for a summary. Installing that summary into later history is a different edit with a different cache consequence.", "input": "A stable request plus a compaction instruction", "output": "A summary candidate; no automatic post-edit cache guarantee"}, {"title": "Evaluate the marginal change", "explanation": "At commit time, compare future savings against suffix rebuilding and additional unpaid cost. Planner expense already incurred is sunk, although total-task accounting still includes it.", "input": "Candidate lengths, prices and reuse assumptions", "output": "Incremental net value"}, {"title": "Honor capacity and safety", "explanation": "Defer an uneconomical safe candidate if there is room. Hard capacity may require a safe edit despite negative economics; it never licenses losing mandatory evidence.", "input": "Net value plus capacity and safety checks", "output": "Commit, wait or fail explicitly"}], "correction": "The article’s fixed 30% / 15% / 40% suggestions are not universal thresholds. An uncached dynamic region can still invalidate later cached prefixes. The local prices and lexical units are assumptions, and published tool hit-rate anecdotes are not measurements of this project.", "modules": ["cache.py · prefix, zones and value", "projection.py · compaction request", "kv.py · scalar dependency illustration"], "fields": ["cache_requests", "zone_costs", "forecast", "kv", "cache_valid_decision", "commit"], "view": "cache", "coverage_ids": ["commit", "zones", "cache-safe", "forecast", "kv"]}, {"id": "tools", "title": "Four tools, different responsibilities", "pages": "5–6", "question": "Which production-tool ideas belong at which layer?", "thesis": "The article draws engineering lessons from multiple projects. Their mechanisms are complementary, but the local code does not install or reproduce those complete products.", "stages": [{"title": "Content diet", "explanation": "Format cleanup and duplicate-read detection can reduce avoidable input without a model call. “No API call” still has CPU, storage and integration costs.", "input": "Recorded tool output", "output": "Auditable cleaning or reference substitution"}, {"title": "Code map", "explanation": "A versioned symbol map lets a task inspect structure before selecting an exact function. Index and tool-schema overhead can outweigh benefits for tiny tasks.", "input": "Python files and versions", "output": "Symbols, ranges and precise source reads"}, {"title": "Local summaries", "explanation": "A local model adds a middle cost tier; structured turn summaries make goals, decisions, constraints and sources inspectable.", "input": "Eligible text or a completed turn", "output": "A structured derived record"}, {"title": "Sending-view edits", "explanation": "DCP-inspired view separation preserves history while changing the outgoing representation. Aged failed-call inputs can shrink while full error results remain.", "input": "Historical tool spans", "output": "A valid outgoing message pair with bounded display"}], "correction": "The article’s engineering tools do not all implement one identical four-stage pipeline. Local host hooks, code indexes, summaries and message transforms have distinct integration requirements. This project owns its own projection layer; it has no access to hidden host context.", "modules": ["preprocess.py · content filter", "codemap.py · Python AST", "summaries.py · turn summaries", "governance.py · error input handling"], "fields": ["preprocess", "codemap", "symbol", "summary", "negative_cases"], "view": "mechanisms", "coverage_ids": ["filter", "codemap", "cctx", "dcp", "file-tracker"]}, {"id": "decisions", "title": "The seven architecture decisions", "pages": "6–12", "question": "How do the surveyed mechanisms become a coherent system?", "thesis": "This is the author’s architecture synthesis, not a single unified paper result. Good parts can still interact badly if their contracts are unclear.", "stages": [{"title": "Represent and ingest", "explanation": "Decisions 1–2: combine episode-level retrieval with object-level control, then preserve raw input before deterministic cleanup and optional semantic processing.", "input": "Raw observations", "output": "Stable identity, versions, views and optional indexes"}, {"title": "Assign judgment and timing", "explanation": "Decisions 3–4: use a cost cascade where appropriate; let system pressure and model task boundaries trigger work. Tool completion and state validity remain host responsibilities.", "input": "Eligibility, uncertainty and capacity pressure", "output": "A bounded proposal at an appropriate time"}, {"title": "Control edits and economics", "explanation": "Decisions 5–6: price the changed suffix and separate raw records from display. Preserve exact evidence and use transactional view changes.", "input": "Validated proposal plus current state", "output": "A recoverable and auditable commit or deferral"}, {"title": "Learn carefully", "explanation": "Decision 7: collect comparable training candidates and cross-session associations. Do not claim that logging a pattern updates model parameters or proves a root cause.", "input": "Audited traces and supported labels", "output": "Candidate datasets and hypotheses for later evaluation"}], "correction": "Graph edge percentages, universal cache thresholds and automatic gains from combining components require independent evaluation. Core records may need revision; a file path is not a unique historical object; observed association is not causality.", "modules": ["fusion.py · representation", "runtime.py · timing", "governance.py · authority", "cache.py · economics", "flywheel.py · candidate generation"], "fields": ["fusion_nodes", "tiered", "forecast", "patterns", "cleaned"], "view": "system", "coverage_ids": ["fusion", "edge-cascade", "object-cascade", "triggers", "forecast", "non-destructive", "training", "slow-clock"]}, {"id": "modes", "title": "Two modes, one storage foundation", "pages": "12–13", "question": "What changes when retrieval becomes unavailable?", "thesis": "Retrieve-First rebuilds a working set around the query. In-Place governs an existing history. A session can move between them when operational availability changes.", "stages": [{"title": "Preserve mandatory context", "explanation": "Begin both routes with the task requirements and known live dependencies. Retrieval relevance is not a substitute for those obligations.", "input": "Current task and dependency roots", "output": "Protected base context"}, {"title": "Use Retrieve-First", "explanation": "When the retriever is usable, bring back ranked evidence and pack it within the full request capacity. Explicit node invalidation and edge tuning can adjust retrieval behavior.", "input": "Query plus usable index", "output": "Query-specific evidence and source labels"}, {"title": "Fallback deliberately", "explanation": "A connection, timeout or missing-file failure can trigger In-Place. Invalid formats or stale graph versions remain errors instead of being disguised as an outage.", "input": "Operational retrieval failure", "output": "A checked in-place request or a capacity error"}, {"title": "Keep recovery honest", "explanation": "In-Place still requires accessible local originals for exact recovery. No external retrieval service is different from having no storage anywhere.", "input": "Folded reference and local archive", "output": "Verified historical text when recovery is requested"}], "correction": "The article’s “no external storage” wording needs this distinction. Neither mode guarantees that hidden but relevant evidence will be found. The exported trace shows the recorded route change, not a permanent live monitor.", "modules": ["runtime.py · context_for", "projection.py · required_view", "evidence.py · pack_evidence", "store.py · recover"], "fields": ["retrieved", "retrieve_first", "fallback"], "view": "retrieval", "coverage_ids": ["two-modes", "retrieval-tune", "sidecar"]}, {"id": "coding", "title": "A smaller four-component coding design", "pages": "13–17", "question": "What is the minimum useful integration for a coding agent?", "thesis": "The article deliberately simplifies its broad architecture into a content filter, file tracker, GC engine and cache guard. Not every task needs the entire graph and model cascade.", "stages": [{"title": "Filter incoming content", "explanation": "Handle clear formatting noise while keeping original data and sparse evidence. Truncation without a recoverable source can lose the only useful error.", "input": "Tool result", "output": "Cleaned view or recoverable reference"}, {"title": "Track the exact read", "explanation": "Compare path, version, range and content hash rather than path alone. Preserve evidence that reflects a changed file or a different range.", "input": "A new file read plus prior read identities", "output": "Fresh content or an equivalent-read alias"}, {"title": "Govern at a safe boundary", "explanation": "The model can request a turn range; the controller protects current work, instruction-file records and side effects. System capacity pressure remains a useful backstop.", "input": "Explicit request or pressure trigger", "output": "A validated fold/mask/prune candidate"}, {"title": "Apply the cache guard", "explanation": "Evaluate the change before switching the view. An appended request for a summary and actually replacing history are not the same cache operation.", "input": "Candidate, state and cache assumptions", "output": "Commit or pending; no hidden host mutation"}], "correction": "Coding tools are not universally idempotent: writes, edits and external actions require audit and safe timing. This prototype retains system triggers and side-effect protections rather than relying solely on the model. A real host must expose a supported pre-send message transformation interface.", "modules": ["preprocess.py · content filter and file tracker", "runtime.py + governance.py · GC engine", "cache.py · cache guard"], "fields": ["preprocess", "events", "commit", "negative_cases"], "view": "system", "coverage_ids": ["filter", "file-tracker", "triggers", "instruction-audit", "commit"]}, {"id": "evaluate", "title": "Evaluate reliable progress, not only compression", "pages": "3, 12, 17", "question": "What evidence would show that governance actually helps?", "thesis": "The article motivates long-term cost governance. A convincing evaluation must keep task success, evidence use, total cost and latency visible together.", "stages": [{"title": "Track evidence survival", "explanation": "Separate stored originals, retrieved candidates, sent evidence and evidence correctly used by the model. A successful archive read only proves one link in this chain.", "input": "Source IDs and request traces", "output": "Reachability and selection measurements"}, {"title": "Account for the whole task", "explanation": "Include planning, extraction, retries, recovery and cache rebuilds. A smaller request may shift work elsewhere, so report cost per successful task.", "input": "Comparable task outcomes and full resource use", "output": "End-to-end cost and quality measurements"}, {"title": "Build comparable candidates", "explanation": "Keep dependencies in a golden trace and pair alternatives under comparable input states. Future successful output must not leak into an evaluated input.", "input": "Audited source trajectories", "output": "SFT/DPO/benchmark/skill candidates"}, {"title": "Separate association from learning", "explanation": "A cross-session pattern is a supported association. Training requires a separate procedure and evaluation; a candidate skill is not automatically installed.", "input": "Multiple labeled sessions", "output": "Hypotheses and candidate improvements"}], "correction": "The current experiments verify local mechanisms using synthetic fixtures. Neural faithfulness, actual provider billing, benchmark scores and model training remain unmeasured. Passing tests and resolving 44 implementation references are different kinds of evidence.", "modules": ["flywheel.py · comparable candidates", "summaries.py · cross-session patterns", "tests/ · behavioral checks"], "fields": ["assertions", "flywheel", "patterns", "cleaned", "packing"], "view": "mechanisms", "coverage_ids": ["training", "slow-clock"]}]}, "coverage": [{"id": "objects", "article_pages": "2", "method": "ContextObject + stable IDs", "status": "mechanism", "implementation": ["src/context_lab/types.py:C mitation": "Symbolic connected components, not neural recursive abstraction or a causal explanation."}, {"id": "two-modes", "article_pages": "12–13", "method": "Availability-based mode switching", "status": "mechanism", "implementation": ["src/context_lab/runtime.py:context_for"], "tests": ["tests/test_revision.py:test_retrieve_first_keeps_dependency_and_mode_switch"], "limitation": "Local storage remains required for exact recovery; operational outages only trigger fallback."}, {"id": "retrieval-tune", "article_pages": "12", "method": "Invalidate retrieval nodes / tune edge costs", "status": "mechanism", "implementation": ["src/context_lab/fusion.py:tune"], "tests": ["tests/test_revision.py:test_fusion_edges_persistence_tuning_and_gc"], "limitation": "Explicit validated edits; no learned retrieval optimizer."}, {"id": "file-tracker", "article_pages": "14", "method": "Session-scoped path/version/range/hash tracker", "status": "mechanism", "implementation": ["src/context_lab/preprocess.py:FileStateTracker"], "tests": ["tests/test_revision.py:test_terminal_clean_and_tracker_reuses_folded_source"], "limitation": ""}, {"id": "instruction-audit", "article_pages": "15", "method": "Instruction files / non-idempotent write audit", "status": "mechanism", "implementation": ["src/context_lab/store.py:append", "src/context_lab/projection.py:protected"], "tests": ["tests/test_revision.py:test_user_fold_only_and_media_instruction_write_guards"], "limitation": "Known write tool names inferred; host must mark other side-effecting tools."}, {"id": "kv", "article_pages": "companion explanation §2.7", "method": "Causal attention / prefix cache illustration", "status": "mechanism", "implementation": ["src/context_lab/kv.py:attention"], "tests": ["tests/test_adapters_cost_cli.py:test_cache_ttl_scope_prefix_and_cost"], "limitation": "Scalar illustration, not a Transformer or KV implementation benchmark."}]}</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=x=>Array.isArray(x)?x:[];
const obj=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
const num=x=>typeof x==='number'&&Number.isFinite(x)?x:null;
const fmt=x=>num(x)===null?'Not recorded':x.toLocaleString('en-US',{maximumFractionDigits:2});
const json=x=>JSON.stringify(x,null,2);
const badge=(x,kind='')=>`<span class="badge ${kind}">${esc(x)}</span>`;
const empty=x=>`<div class="empty">${esc(x)}</div>`;
const detail=(label,data)=>`<details><summary>${esc(label)}</summary><pre>${esc(typeof data==='string'?data:json(data))}</pre></details>`;
const stat=(label,value,note)=>`<div class="stat"><div class="label">${esc(label)}</div><strong>${esc(value)}</strong><small>${esc(note)}</small></div>`;
const panel=(title,body,tag='')=>`<section class="panel"><div class="section-head"><h2>${esc(title)}</h2>${tag}</div>${body}</section>`;
const tabs=[['learn','Read the article'],['system','Understand the codebase'],['overview','The big picture'],['objects','Context transformation'],['timeline','Plan & event replay'],['cache','Why commit or wait?'],['retrieval','Evidence selection'],['memory','Memory & provenance'],['graph','Connections & details'],['mechanisms','Other mechanisms'],['atlas','All 44 methods']];
let bundle=JSON.parse($('seed').textContent), runs=bundle.runs||[], index=Math.max(0,runs.findIndex(r=>r.trace?.sizes)), page='studio', stage=0, selectedObject=0, eventIndex=0, ablation='all', selectedNode=null, timer=null;
const current=()=>runs[index]||{name:'No run',trace:{},artifacts:{}};
const data=()=>obj(current().trace);
const kind=d=>d.fusion_nodes?'Methodology':d.deferred?'Reliability':d.sizes?'Core experiment':'Partial trace';
function header(k,title,lead){return `<div class="eyebrow">${esc(k)}</div><h1>${esc(title)}</h1><p class="lead">${lead}</p><div class="source-line">SOURCE · ${esc(current().source||current().name)} · ${badge('Recorded data')}</div>`;}
function setPage(next){stop();page=next;render();window.scrollTo(0,0);}
function renderNav(){
 $('nav').innerHTML=`<div class="method-nav">${cases.map((c,i)=>`<button data-case="${i}" class="${page==='studio'&&caseIndex===i?'active':''}"><span>${String(i+1).padStart(2,'0')}</span>${c.name}<small>${c.method}</small></button>`).join('')}</div><details class="reference-nav" ${page!=='studio'?'open':''}><summary>Run evidence & reference</summary>${tabs.map(([id,label])=>`<button data-page="${id}" class="${id===page?'active':''}" ${id===page?'aria-current="page"':''}>${label}</button>`).join('')}</details>`;
 $('nav').querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
}

function selectRuns(){ $('run').innerHTML=runs.map((r,i)=>`<option value="${i}">${esc(kind(r.trace))} · ${esc(r.name)}</option>`).join('');$('run').value=index;}
function render(){document.body.classList.toggle('method-mode',page==='studio');renderNav();try{const views={studio:methodologyStudio,learn,system,mechanisms,atlas,overview,objects,timeline,cache,retrieval,memory,graph};$('content').innerHTML=views[page]()+`<div class="footer">Concept diagrams explain mechanisms; recorded outputs explain what this program did. They do not establish semantic correctness, paper benchmark performance, or actual provider savings. Missing fields are shown as unavailable.</div>`;bind();bindLearning();bindMethodology();}catch(e){$('content').innerHTML=header('Import diagnostics','This section cannot interpret the trace.','Other sections may still be available. No missing measurements have been filled in.')+empty(e.message)+detail('Inspect the complete imported trace',data());}}
function finalDecision(d){return obj(d.resumed||d.commit);}
function bar(label,value,max,cls=''){if(num(value)===null)return `<div class="bar-label">${esc(label)} <span>Not recorded</span></div>`;return `<div><div class="bar-label"><span>${esc(label)}</span><b>${fmt(value)} units</b></div><div class="track" role="img" aria-label="${esc(label)}: ${fmt(value)} units"><span class="fill ${cls}" style="width:${Math.max(0,Math.min(100,value/Math.max(max,1)*100))}%"></span></div></div>`;}
function overview(){const d=data(),c=finalDecision(d),s=obj(d.sizes),before=s.raw??c.before,after=s.governed??c.after;const reduction=num(before)!==null&&before>0&&num(after)!==null?(100*(before-after)/before).toFixed(1)+'%':'Not recorded';const stages=d.sizes?[['Raw request',s.raw,'grey'],['After preprocessing',s.preprocessed,''],['After governance',s.governed,'mint']]:[['Before candidate',c.before,'grey'],['After candidate',c.after,'mint']];const max=Math.max(1,...stages.map(x=>num(x[1])??0));let story=d.sizes?'The run first removed deterministic repetition, then changed the active view. The original objects stayed in storage.':d.deferred?'The same candidate was deferred, then reconsidered after reopening the runtime. A persisted plan survived; an in-flight model call was not replayed.':d.fusion_nodes?'This run connected history objects to a retrieval graph, preserved exact constraints, committed governance, then switched from retrieval to an in-place fallback.':'This is a partial trace. Explore the sections for which measurements are available.';return header('01 / Orientation','See what changed. Understand why.',esc(story))+`<div class="grid three">${stat('Request before',fmt(before),'Serialized teaching units')}${stat('Request after',fmt(after),'Candidate length; check commit status below')}${stat('Length reduction',reduction,'Calculated from the displayed endpoints')}</div><div class="grid">${panel('A smaller active context',`<div class="bars">${stages.map(x=>bar(x[0],x[1],max,x[2])).join('')}</div><p class="small muted">Bar lengths compare request sizes, not deletion from the original archive.</p>`)}${panel('The decision is a separate question',`<div class="row">${badge(c.committed===true?'Committed':c.committed===false?'Not committed':'Decision not recorded',c.committed?'good':'warn')}</div><p style="margin-top:18px">${num(c.saved)!==null?`The candidate saves <b>${fmt(c.saved)} units</b>. Its recorded incremental net value is <b>${fmt(c.net_value)}</b>.`:'No final savings measurement was recorded.'}</p><p class="muted small">Shorter does not automatically mean cheaper. Cache reuse, capacity and safety checks influence the decision.</p><button data-go="cache">Explain this decision →</button>` )}</div><div class="journey"><button data-go="objects"><b>01 · FOLLOW THE CONTENT</b>What did the model stop seeing?</button><button data-go="timeline"><b>02 · FOLLOW THE PLAN</b>When did a proposal take effect?</button><button data-go="retrieval"><b>03 · FOLLOW THE EVIDENCE</b>What actually fit in the request?</button><button data-go="memory"><b>04 · FOLLOW THE FACTS</b>What was remembered or corrected?</button></div>${panel('What this recording proves',Object.keys(obj(d.assertions)).length?Object.entries(d.assertions).map(([k,v])=>`<p>${badge(v===true?'Passed':v===false?'Failed':'Recorded',v===true?'good':'bad')} ${esc(k.replaceAll('_',' '))}</p>`).join(''):`<p class="muted">${esc(d.note||d.unit_note||'A deterministic mechanism run. Inspect recorded fields before drawing conclusions.')}</p>`)}${detail('Recording inventory (all top-level fields)',Object.keys(d))}`;}
const modes={not_in_snapshot:'This object is not present in the selected recorded request snapshot. It may have been appended later; absence alone does not prove pruning.',active:'The original object is visible.',alias:'An equivalent read points to an existing source. Its own raw record is retained.',cleaned:'A deterministic cleanup changes the display, not the raw archive.',folded:'A recovery reference replaces the full body. Recovery is possible, not automatic.',masked:'An allowed portion is hidden; inspect the serialized request for exact retained content.',hidden:'The object is omitted from the active request. It is not deleted from storage.',distilled:'A derived summary replaces the body. Citation checks cannot prove semantic accuracy.'};
function requestObject(id,at){const artifact=obj(current().artifacts)[['01-raw.txt','02-preprocessed.txt','03-governed.txt'][at]];if(typeof artifact!=='string')return {available:false};try{const messages=artifact.split('\n').filter(Boolean).map(line=>JSON.parse(line));const result=messages.find(m=>typeof m.content==='string'&&(m.content.includes("<object id='"+id+"'")||m.content.includes('<object id="'+id+'"')));return {available:true,message:result};}catch{return {available:false};}}
function stateFor(id,at){const d=data();let mode='active';if(at>=1)for(const e of arr(d.preprocess))if(e.id===id)mode=e.mode; if(at>=2){for(const e of arr(d.events)){if(e.kind!=='commit')continue;for(const a of arr(obj(obj(e.data).plan).actions))if(a.target===id)mode=({fold:'folded',mask:'masked',prune:'hidden',distill:'distilled',keep:mode})[a.action]||mode;}}const recorded=requestObject(id,at);if(recorded.available&&!recorded.message&&mode!=='hidden')return 'not_in_snapshot';return mode;}
function objects(){const d=data(),list=arr(d.objects);if(!list.length)return header('02 / Context','Follow an object through the system.','Objects need to be recorded to compare their raw content and display state.')+empty('This trace does not include the raw object list. Load a core demo run. A run folder also supplies the exact before/after text artifacts.');selectedObject=Math.min(selectedObject,list.length-1);const o=list[selectedObject],mode=stateFor(o.id,stage),keys=['01-raw.txt','02-preprocessed.txt','03-governed.txt'],artifact=obj(current().artifacts)[keys[stage]];return header('02 / Transformation','Keep the source. Change the view.','Select a stage, then an object. The state labels are reconstructed only from recorded preprocessing and committed actions. The archive pane always shows the original content.')+`<div class="steps" aria-label="Context stage">${['Raw','Preprocessed','Governed'].map((x,i)=>`<button data-stage="${i}" aria-pressed="${stage===i}" class="${stage===i?'active':''}">${i+1}. ${x}</button>`).join('')}</div><div class="object-grid"><div class="object-list">${list.map((x,i)=>`<button data-object="${i}" class="${i===selectedObject?'active':''}" aria-pressed="${i===selectedObject}"><small>${esc(x.id)}</small>${badge(stateFor(x.id,stage))} <span class="small">Turn ${esc(x.turn)} · ${esc(x.kind)}</span></button>`).join('')}</div><div>${panel('Selected object',`<div class="row">${badge(mode,mode==='hidden'?'warn':'')} ${badge('Original retained','good')}</div><p style="margin-top:16px">${esc(modes[mode]||'Unrecognized display state; inspect raw fields.')}</p><div class="row">${Object.entries(obj(o.metadata)).filter(([,v])=>v===true).map(([k])=>badge(k,'neutral')).join('')}</div><p class="path">Dependencies: ${esc(arr(o.dependencies).join(' → ')||'None recorded')}</p><h3>Original archive content · verbatim</h3><pre>${esc(o.content)}</pre>${detail('Tool arguments and metadata',{tool:o.tool,arguments:o.arguments,metadata:o.metadata})}`)}${panel('What the model sees for this object',requestObject(o.id,stage).available?(requestObject(o.id,stage).message?`<pre>${esc(requestObject(o.id,stage).message.content)}</pre><p class="small muted">Exact object content extracted from the imported request snapshot. The full serialized protocol remains below.</p>`:empty(mode==='hidden'?'The recorded request omits this object; the recorded plan marks it hidden.':'Not present in this request snapshot. This does not by itself identify the reason.')):empty('Per-object display text requires a readable stage snapshot. Import the run folder.'))}${panel('Exact request at this stage',artifact?`<p class="small muted">Loaded from ${esc(keys[stage])}. Includes message wrappers and historical references.</p><pre>${esc(artifact)}</pre>`:empty('Exact projection text was not imported. Import the run folder to add 01-raw.txt, 02-preprocessed.txt and 03-governed.txt. State labels alone are not a reconstructed prompt.'))}</div></div>${obj(current().artifacts)['04-recovered.txt']?panel('Recovery result',`<p>The recorded recovered text is shown below. Reading an archive does not re-execute the historical tool.</p>${detail('Open the recovered historical text',current().artifacts['04-recovered.txt'])}`):''}`;}
function eventExplain(e){const k=e.kind;return ({append:'A raw object was appended. This changes the history on which future plans depend.',pending:'A candidate was saved after rehearsal. It has not yet changed the active context.',defer_cache:'The candidate stayed pending because its recorded cache economics did not justify a commit.',commit:obj(e.data).preprocess?'Preprocessing changed the active display. The original objects remain stored.':'A transaction applied the recorded changes to the active view.',recover:'An archived source was read and checked. This event alone does not say the full text was reinserted into the prompt.',stale_gc:'The old proposal was rejected because it no longer matched current state.',mode_switch:'The runtime changed how it assembles the next request.'})[k]||'This is an event recorded by the runtime. Inspect its payload for the exact operation.';}
function timeline(){const d=data(),events=arr(d.events);if(!events.length)return header('03 / Lifecycle','A proposal is not a commit.','The lifecycle separates planning, validation, persistence and application.')+(d.deferred?panel('Recorded lifecycle checkpoints',`<div class="journey"><button data-go="cache"><b>01 · SAVED CANDIDATE</b>${badge(d.deferred.status||'pending','warn')}</button><button data-go="cache"><b>02 · REOPEN & REEVALUATE</b>${badge(obj(d.resumed).status||'Not recorded','good')}</button></div><p>No timestamped event stream was included in this trace. These are checkpoints, not reconstructed events.</p>${detail('Deferred checkpoint',d.deferred)}${detail('Resumed checkpoint',d.resumed)}`):empty('No event stream was recorded. Use a core demo trace to step through actual events.'));eventIndex=Math.min(eventIndex,events.length-1);const e=events[eventIndex];return header('03 / Lifecycle','Replay the recorded decisions.','Step through events in recorded sequence order. Playback is a reading aid, not original elapsed time; no timestamps are invented.')+`<div class="row"><button id="prev" ${eventIndex===0?'disabled':''}>← Previous</button><button id="play" class="primary">${timer?'Pause':'Play sequence'}</button><button id="next" ${eventIndex===events.length-1?'disabled':''}>Next →</button><span class="muted small">Event ${eventIndex+1} of ${events.length}</span></div><label class="sr" for="event-range">Recorded event position</label><input id="event-range" class="range" type="range" min="0" max="${events.length-1}" value="${eventIndex}"><div class="grid">${panel('Recorded event stream',`<div class="timeline">${events.map((x,i)=>`<button class="event ${i===eventIndex?'selected':''}" data-event="${i}" aria-pressed="${i===eventIndex}"><span class="event-num">${esc(x.seq??i+1)}</span><span><b>${esc(String(x.kind).replaceAll('_',' '))}</b><small>${esc(obj(x.data).id||obj(x.data).planner||'Runtime boundary')}</small></span>${badge(i<=eventIndex?'Read':'Next','neutral')}</button>`).join('')}</div>`)}${panel('What this event means',`<div class="eyebrow">SEQUENCE ${esc(e.seq)}</div><h2>${esc(String(e.kind).replaceAll('_',' '))}</h2><p>${esc(eventExplain(e))}</p><pre>${esc(json(e.data))}</pre><div class="note">Only a committed action changes the view. A pending proposal and an archive read must not be mistaken for that change.</div>`)}</div>${Object.keys(obj(d.negative_cases)).length?panel('Rejected operations are part of the result',`<div class="table-scroll"><table><thead><tr><th>Attempt</th><th>Recorded rejection</th></tr></thead><tbody>${Object.entries(d.negative_cases).map(([k,v])=>`<tr><td>${esc(k.replaceAll('_',' '))}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`):''}`;}
function decisions(d){return [['Valid-cache decision',d.cache_valid_decision],['Deferred checkpoint',d.deferred],['Commit attempt',d.commit],['Resumed checkpoint',d.resumed]].filter(([,x])=>x&&typeof x==='object');}
function cache(){const d=data(),ds=decisions(d),scale=Math.max(1,...ds.map(([,c])=>Math.abs(num(c.net_value)??0))),c=finalDecision(d),valid=ds.length;const requests=arr(d.cache_requests).length?d.cache_requests:d.zone_costs;return header('04 / Economics','Shorter can still cost more.','Compare the recorded decisions first. The separate sandbox below lets you explore assumptions without changing the run.')+panel('Recorded decisions',valid?ds.map(([label,x])=>{let v=num(x.net_value);return `<div class="decision"><div class="row between"><h3>${label}</h3>${badge(x.committed===true?'Committed':x.committed===false?'Deferred':'Not recorded',x.committed?'good':'warn')}</div><div class="signed"><div class="signed-track" role="img" aria-label="Net value ${fmt(v)}">${v!==null?`<span class="signed-value ${v<0?'negative':''}" style="left:${v<0?50-Math.abs(v)/scale*50:50}%;width:${Math.abs(v)/scale*50}%"></span>`:''}</div><b class="${v<0?'negative':'positive'}">${fmt(v)}</b></div><div class="row muted small"><span>Saved: ${fmt(x.saved)} units</span><span>Common prefix: ${fmt(x.common_prefix)} units</span><span>Before → after: ${fmt(x.before)} → ${fmt(x.after)}</span></div></div>`;}).join('')+`<div class="legend"><span>← Negative incremental value</span><span>Zero at center</span><span>Positive incremental value →</span></div><p class="small muted" style="margin-top:15px">Normalized cost units. A recorded decision may also depend on hard capacity and safety checks; the chart does not infer unrecorded reasons.</p>`:empty('No cost decisions were recorded.'))+(Array.isArray(requests)?panel('Cache use across recorded requests',`<div class="legend"><span><i class="dot" style="background:var(--mint)"></i>Read from cache</span><span><i class="dot" style="background:var(--blue)"></i>Write to cache</span><span><i class="dot" style="background:#d39740"></i>Uncached</span></div>${requests.map((r,i)=>{const total=Math.max(1,(r.read||0)+(r.write||0)+(r.uncached||0));return `<div style="margin function learn(){if(!lessons.length)return empty('Learning content was not included in this HTML export. Regenerate it with the current exporter.');const l=lessons[lessonIndex],step=l.stages[lessonStep];return `<div class="eyebrow">READING PATH / ARTICLE + IMPLEMENTATION + EVIDENCE</div><h1>Understand the system, one decision at a time.</h1><p class="lead">A visual companion to <i>Agent Context Governance: Reflections</i>. The article surveys existing mechanisms, proposes an architecture, then reduces it to a smaller coding design. These are different levels of evidence.</p><div class="article-parts">${arr(learning.article_parts).map((p,i)=>`<span>${i+1}. ${esc(p.title)} <small>· pp. ${esc(p.pages)}</small></span>`).join('')}</div><p class="source-tag">Reading source: the supplied 18-page article. Corrections follow the supplied paper versions and the companion methodology guide. Diagrams on this page are conceptual; run evidence is linked separately.</p><div class="lesson-picker" aria-label="Article topics">${lessons.map((x,i)=>`<button data-lesson="${i}" class="${i===lessonIndex?'active':''}" aria-pressed="${i===lessonIndex}"><small>${String(i+1).padStart(2,'0')} · ARTICLE PP. ${esc(x.pages)}</small>${esc(x.title)}</button>`).join('')}</div><section class="panel lesson-main"><div class="row between"><div class="eyebrow">LESSON ${lessonIndex+1} / ${lessons.length}</div>${badge('Conceptual walkthrough','neutral')}</div><h2>${esc(l.question)}</h2><p class="toc-explain">${esc(l.thesis)}</p><div class="lesson-flow" aria-label="Mechanism steps">${l.stages.map((s,i)=>`<button data-lesson-step="${i}" class="${i===lessonStep?'active':''}" aria-pressed="${i===lessonStep}"><span class="number">STEP 0${i+1}</span><b>${esc(s.title)}</b></button>`).join('')}</div><h3>${esc(step.title)}</h3><p>${esc(step.explanation)}</p><div class="io-flow"><div class="io-box"><b>Input</b>${esc(step.input)}</div><div class="io-arrow" aria-hidden="true">→</div><div class="io-box out"><b>Output</ sc(symbol.name)}</b><span class="small muted">lines ${esc(symbol.start)}–${esc(symbol.end)}</span></div><p class="small">${esc(symbol.docstring||'No docstring recorded.')}</p></div>`).join('')}`).join('')}${d.symbol?detail('Exact recorded symbol read',d.symbol):''}<p class="small muted">A versioned Python AST map narrows reading scope. It does not run the function or prove the function is correct.</p>`:empty('No code map was recorded. Load the core run to inspect its function range and precise read.'))+panel('Why editing history affects later computation',original.length?`<label for="kv-field">Recorded scalar illustration </label><select id="kv-field"><option value="K_layer2" ${kvField==='K_layer2'?'selected':''}>Layer 2 keys</option><option value="V_layer2" ${kvField==='V_layer2'?'selected':''}>Layer 2 values</option></select>${['original','appended','edited'].map(name=>`<h3 style="margin-top:20px">${name[0].toUpperCase()+name.slice(1)}</h3><div class="cell-row">${arr(obj(kv[name])[kvField]).map((v,i)=>`<div class="kv-cell ${original[i]!==v?'changed':''}"><small>POSITION ${i+1}</small><b>${fmt(v)}</b><small>${i>=original.length?'New position':v===original[i]?'Same as original':'Changed'}</small><div class="track" style="height:4px;margin-top:8px"><span class="fill" style="width:${Math.max(0,v/max*100)}%"></span></div></div>`).join('')}</div>`).join('')}<p class="small muted">These are recorded scalar values from a teaching attention model. Appending preserves the earlier positions here; editing changes dependent later values. This is not a GPU KV-cache benchmark.</p>`:empty('No scalar KV result was recorded. The core demo includes this illustration.'))+panel('Data flywheel: outputs, not a trained model',d.flywheel||d.cleaned||d.patterns?`${d.flywheel?`<div class="result-grid">${[['SFT candidates',d.flywheel.sft],['DPO candidates',d.flywheel.dpo],['Skipped candidates',arr(d.flywheel.skipped).length]].map(([l,v])=>`<div>${esc(l)}<strong>${fmt(v)}</strong></div>`).joi function methodologyStudio(){const c=cases[caseIndex];return `<div class="scenario-number">METHOD ${String(caseIndex+1).padStart(2,'0')} / 08 · ${c.method.toUpperCase()}</div><h1 class="scenario-title">${c.title}</h1><p class="scenario-prompt">${c.goal}</p><div class="situation"><b>When this happens</b><p>${c.moment}</p></div>${[sceneClean,sceneGC,sceneRetrieve,sceneWrite,sceneWorking,sceneCompress,sceneCommit,sceneChoose][caseIndex]()}<div class="lesson-foot"><div><h3>Use it when</h3><p>${c.when}</p></div><div><h3>The mistake to avoid</h3><p>${c.avoid}</p></div></div><details class="method-evidence"><summary>How this relates to the article and your recorded experiments</summary><p class="small">${c.paper}. This scene is an explicit teaching example, not a neural inference result or a replay of your trace.</p><button data-method-reference="${c.lesson}">Read the method’s qualifications</button> <button data-go="overview">Inspect recorded experiments</button></details><div class="scene-next"><button data-method-reset>Reset this example</button><span>Make a choice above. Watch what changes.</span><button class="primary" data-method-next>${caseIndex===7?'Start again':'Next method →'}</button></div>`;}
function sceneClean(){const raw=['⠋ connecting…','INFO connected','INFO connected','INFO connected','ERROR duplicate charge: request #42','INFO test finished','INFO test finished'];const cleaned=['INFO connected','ERROR duplicate charge: request #42','INFO test finished'];return sceneFrame('Before the output enters the model’s window',`<div class="scene-split"><div class="scene-column"><h3>Tool output <span>7 displayed lines</span></h3>${raw.map(t=>`<div class="paper-line ${t.startsWith('ERROR')?'critical':''}">${t}</div>`).join('')}</div><div class="scene-arrow">→</div><div class="scene-column"><h3>Next request <span>${cs.clean?'3':'7'} displayed lines</span></h3>${(cs.clean?cleaned:raw).map(t=>`<div class="paper-line ${t.startsWith('ERROR')?'critical':cs.clean?'clean':''}">${t}</div>`).join('')}<p class="content-note">The error is rare, but important. It stays.</p></div></div><div class="interventions">${btn('clean','Apply deterministic cleanup',true)}</div>${cs.clean?outcome('Repetition removed; error retained.','The original seven-line output stays in the archive. This transformation needed no model judgment.') : ''}<hr><h3>Now the agent reads payment.py again</h3><div class="row"><button data-method-action="same-version" class="${!cs.changed?'active':''}">Same content and range</button><button data-method-action="changed-version" class="${cs.changed?'active':''}">File changed since last read</button></div><div class="scene-split" style="margin-top:16px"><div>${piece('Earlier read','charge(amount) → gateway.charge(amount)')}<span class="source-chip">Version 1 · saved original</span></div><div class="scene-arrow">→</div><div>${piece(cs.changed?'Fresh read must enter':'Use an equivalent-read reference',cs.changed?'charge(amount, key) → gateway.charge(amount, key=key)':'Same content as the earlier read. Full source is available on demand.',cs.changed?'root':'folded')}<span class="source-chip">${cs.changed?'Version 2 · new evidence':'Version 1 · same range and content'}</span></div></div>${cs.changed?outcome('Do not deduplicate this read.','The new idempotency key is precisely the change the agent must inspect. Filename equality is insufficient.','waiting'):''}`);}
const gcItems=[['rule','User constraint','Never charge twice. Amounts must remain integer cents.','root'],['code','Original payment code','charge(amount) → gateway.charge(amount) · needed to compare the fix',''],['log','Repetitive progress log','RUN … RUN … RUN … RUN … COMPLETE',''],['guess','Disproven hypothesis','“The database pool causes the duplicate charge.” Later evidence disproved this.',''],['error','Exact error evidence','DuplicateChargeError: request #42 charged twice at retry()','root']];
function sceneGC(){const states=cs.gc;return sceneFrame('Which history still supports the current task?',`<div class="dependency-caption"><b>Current goal: finish the fix; preserve comparison evidence.</b><br>Current goal → original code &nbsp; · &nbsp; Payment safety → user constraint + error evidence</div><div class="scene-split"><div class="scene-column"><h3>Active context</h3>${gcItems.map(([id,t,text,type])=>{const mode=states[id];return piece(t,mode==='fold'?'Recovery reference → original payment code':mode==='mask'?'RUN … [repeated progress omitted] … COMPLETE':mode==='prune'?'Removed from this request. Original remains archived.':text,mode==='fold'?'folded':mode==='prune'?'pruned':type);}).join('')}</div><div class="scene-arrow">↔</div><div class="scene-column"><div class="archive-box"><h3>Original archive</h3>${gcItems.map(([id,t])=>`<span class="source-chip">${t} · retained</span>`).join('')}<p class="content-note">This storage shelf never changes during the example. Grey crossed-out cards on the left denote content omitted from the request, not visible model messages.</p>${states.code==='fold'?btn('recover-code','The user asks for the old code → recover'):''}</div><div class="interventions">${btn('fold-code','Fold the original code',true)}${btn('mask-log','Mask repetitive log')}${btn('prune-guess','Prune disproven guess')}${btn('prune-rule','Try pruning the constraint')}</div>${cs.gcMessage?outcome(cs.gcBad?'Unsafe choice rejected':'Active view updated',cs.gcMessage,cs.gcBad?'failure':''):outcome('Choose an operation.','Fold keeps a discoverable recovery path. Mask is for eligible repetition. Prune needs an explicit obsolescence reason.','waiting')}</div></div>`);}
const retrieveFacts=[{key:'why',edge:'causal',title:'Reason',text:'A retry reused no idempotency key, so request #42 charged twice.'},{key:'when',edge:'temporal',title:'Decision date',text:'Ada adopted the new retry policy on September 6.'},{key:'other',edge:'semantic',title:'Related but not the answer',text:'The team also discussed database connection-pool size.'}];
function sceneRetrieve(){const ordered=[...retrieveFacts].sort((a,b)=>(a.key===cs.intent?-1:b.key===cs.intent?1:0)),selected=cs.retrieved?ordered.slice(0,cs.slots):[];return sceneFrame('Same archive, different question',`<div class="row"><button data-method-action="query-why" class="${cs.intent==='why'?'active':''}">Ask WHY</button><button data-method-action="query-when" class="${cs.intent==='when'?'active':''}">Ask WHEN</button></div><div class="method-query">${cs.intent==='why'?'Why did Ada change the retry policy?':'When did Ada change the retry policy?'}</div><div class="graph-scene"><div class="graph-anchor"><small>ENTITY</small>Payment service</div><div class="scene-arrow">→</div><div class="graph-anchor"><small>FACET / TOPIC</small>Retry policy</div><div class="scene-arrow">→</div><div>${retrieveFacts.map(f=>`<div class="evidence-path ${cs.retrieved?(selected.some(s=>s.key===f.key)?'chosen':'dim'):''}"><span>── ${f.edge} →</span>${piece(f.title,f.text)}</div>`).join('')}</div></div><p class="content-note">Simplified relationship illustration. A full hierarchy can also include FacetPoint; these highlighted routes show intent, not a measured graph-search score.</p><div class="interventions">${btn('retrieve','Retrieve for this question',true)}<label class="row small">Evidence slots in this example <select id="method-slots"><option value="1" ${cs.slots===1?'selected':''}>1 complete fact</option><option value="2" ${cs.slots===2?'selected':''}>2 complete facts</option></select></label></div><div class="scene-split" style="margin-top:22px"><div class="scene-column"><h3>Required context · always included</h3>${piece('User rule','Never charge twice. Use integer cents.','root')}</div><div class="scene-arrow">+</div><div class="scene-column"><h3>Evidence actually sent</h3>${selected.length?selected.map(f=>piece(f.title,f.text)).join(''):empty('Retrieve to fill this part of the request.')}</div></div>${cs.retrieved?outcome('Intent changes which evidence enters first.',`The ${cs.intent==='why'?'cause':'date'} is prioritized. ${3-selected.length} fact(s) remain outside this request, although all three remain stored. Real packing must also count the question, source labels, wrappers and output reserve.`):''}<p class="case-callout">Slot count is a visual teaching budget, not tokens. No neural retrieval or original PRISM algorithm is being executed in this example.</p>`);}
function sceneWrite(){return sceneFrame('From a conversation to a self-contained memory',`<div class="scene-split"><div class="scene-column"><h3>Conversation at write time</h3>${piece('Ada','“Tomorrow I will use idempotency keys for retries.”')}${piece('Other requirement','“Keep all amounts in integer cents.”','root')}${piece('Chatter','“Thanks, have a good evening.”')}<label class="row small" style="margin-top:15px"><input id="method-anchor" type="checkbox" ${cs.anchor?'checked':''}> Conversation date is known: September 5, 2026</label></div><div class="scene-arrow">→</div><div class="scene-column"><h3>Stored facts</h3>${cs.written&&cs.anchor?`<div class="memory-fact ${cs.corrected?'deleted':''}"><p>Ada will use idempotency keys for retries on September 6, 2026.</p><div class="field-row"><span class="source-chip">Entity: Ada</span><span class="source-chip">Source: Ada’s statement</span></div>${cs.corrected?'<small>Superseded, not physically erased</small>':''}</div>${cs.corrected?`<div class="memory-fact"><p>Ada will use idempotency keys for retries on September 5, 2026.</p><small>Corrects the previous date · source: Ada’s correction</small></div>`:''}<div class="memory-fact">Amounts must remain integer cents.<br><small>Independent requirement · unaffected</small></div><p class="content-note">Greeting skipped by the gate. The useful facts retain their own sources.</p>`:empty(cs.written?'“Tomorrow” has no reliable absolute date. Keep the unresolved source; do not invent a calendar day.':'Write a memory to resolve the entity and relative date.')}</div></div><div class="interventions">${btn('write-memory','Gate → resolve → anchor → write',true)}${cs.written&&cs.anchor?btn('correct-memory','Ada corrects herself: “I meant today”'):''}</div>${cs.corrected?outcome('Correction is targeted.','The date claim changes. The integer-cents requirement does not. Both versions remain auditable; default retrieval excludes the superseded claim.'):cs.written&&!cs.anchor?outcome('A missing anchor is a real uncertainty.','A memory system should preserve the original statement or request clarification instead of fabricating the date.','failure'):''}<div class="shelf" style="margin-top:18px"><span>Semantic view<br><small>“safer payment retries”</small></span><span>Lexical view<br><small>“idempotency keys”</small></span><span>Symbolic view<br><small>Ada · date · policy</small></span></div><p class="content-note">Three search routes point to the same fact. They are not three independent versions of the truth.</p>`);}
function sceneWorking(){return sceneFrame('Working memory is small; the archive is not',`<div class="method-query">User: “Why did we introduce idempotency keys?”</div><div class="scene-split"><div class="scene-column"><h3>Core · always in the working window</h3><div class="working-slot filled">Current task: answer the user’s question.</div><div class="working-slot ${cs.pinned?'filled':''}">${cs.pinned?'Reason: a retry charged request #42 twice. Source: archived test report.':'One free working-memory slot'}</div><h3 style="margin-top:25px">Latest tool observation</h3>${cs.memoryPage===0?empty('The model has not read any archive page yet.'):piece(cs.memoryPage===1?'Archive page 1':'Archive page 2',cs.memoryPage===1?'Deployment finished at 10:00. More results are available.':'The test report shows request #42 was charged twice when a retry lacked an idempotency key.')}</div><div class="scene-arrow">↔</div><div class="scene-column"><div class="archive-box"><h3>Recall / archive · outside context</h3><div class="shelf"><span class="${cs.memoryPage===1?'highlight':''}">Page 1<br>Deployment</span><span class="${cs.memoryPage===2?'highlight':''}">Page 2<br>Duplicate-charge test</span><span>Page 3<br>Connection pool</span></div><p class="content-note">The model only receives the requested page. This drawing lets you see the storage; it is not all sent to the agent.</p></div><div class="interventions">${btn('search-memory','Search archive',true)}${cs.memoryPage===1?btn('heartbeat','Request heartbeat → next page'):''}${cs.memoryPage===2?btn('pin-memory','Put the useful fact in Core'):''}${btn('answer-memory','Try answering now')}</div></div></div>${cs.answered?outcome(cs.pinned?'Answer supported by retrieved evidence':'The needed evidence is not in Core yet',cs.pinned?'“We introduced idempotency keys because a retry charged the same request twice.” The reason is now grounded in the archived test report.':'Search, continue to the relevant page, then preserve the fact before answering. This example deliberately refuses to fill the gap from intuition.',cs.pinned?'':'failure'):''}<div class="interventions">${cs.pinned?btn('sleep-memory','Task ends → background consolidation'):''}</div>${cs.sleep?outcome('Between tasks: consolidate, with sources.','The useful fact can become a reusable archive memory. This is a separate sleep-time extension, not evidence that the model trained itself.'):''}`);}
const sentenceWords='Never charge twice . Retry only with an idempotency key . Amounts must remain integer cents . Ada reviewed the patch on Monday .'.split(' ');
function sceneCompress(){const essentials=cs.question==='retry'?new Set(Array.from({length:17},(_,i)=>i)):new Set([17,18,19,20,21,22,23]);return sceneFrame('Choose what matters to the current question',`<div class="row"><button data-method-action="compress-retry" class="${cs.question==='retry'?'active':''}">Question: how should retries work?</button><button data-method-action="compress-owner" class="${cs.question==='owner'?'active':''}">Question: who reviewed the patch?</button></div><div class="token-board" style="margin-top:20px">${sentenceWords.map((word,i)=>`<span class="word ${cs.dropNot&&i===0?'danger removed':cs.compressed?(essentials.has(i)?'essential':'removed'):''}">${word}</span>`).join('')}</div><div class="token-legend">Green = kept for this question · crossed out = omitted from this passage · orange/red = unsafe omission</div><div class="interventions">${btn('compress','Apply question-aware selection',true)}${btn('drop-negation','Try dropping “Never”')}</div><div class="scene-split" style="margin-top:22px"><div class="scene-column"><h3>Task constraints · protected separately</h3>${piece('Always keep','Never charge twice. Use integer cents.','root')}</div><div class="scene-arrow">+</div><div class="scene-column"><h3>Compressed passage</h3>${piece('What would be sent',sentenceWords.filter((_,i)=>(!cs.compressed||essentials.has(i))&&!(cs.dropNot&&i===0)).join(' '))}</div></div>${cs.dropNot?outcome('The attempted deletion changes meaning.','“Never charge twice” becomes “charge twice.” A high compression ratio would hide a catastrophic mistake. Protect the constraint and reject this candidate.','failure'):cs.compressed?outcome('Different questions preserve different details.','The optional background passage can be compressed for the question. Mandatory task constraints still remain in their own protected part of the request.'):''}<div class="case-callout">Illustrative token selection, not an LLMLingua inference result. LLMLingua uses model-based scoring, LongLLMLingua adds question-aware treatment, and LLMLingua-2 uses learned token classification. None of these scores grants object-deletion authority.</div>`);}
function sceneCommit(){const saved=400,j=cs.edit==='early'?600:100,v=cs.cacheExpired?saved*1.25+(cs.n-1)*saved*.1:cs.n*saved*.1-j*1.15;return sceneFrame('A valid candidate waits at the commit gate',`<div class="row"><button data-method-action="early-edit" class="${cs.edit==='early'?'active':''}">Edit earlier history</button><button data-method-action="late-edit" class="${cs.edit==='late'?'active':''}">Edit only the recent tail</button></div><div class="prefix-row"><div class="prefix-block" style="flex:2">Stable instructions<span>Reusable prefix</span></div><div class="prefix-block ${cs.edit==='early'?'changed':''}" style="flex:3">Long-lived history<span>${cs.edit==='early'?'First edit here':'Still reusable'}</span></div><div class="prefix-block changed" style="flex:1.5">Recent tail<span>Changed suffix</span></div></div><p class="content-note">Both candidates save 400 illustrative units. The new suffix to rebuild is ${j} units. A late edit preserves more of the old prefix.</p><div class="grid"><div><label for="method-calls">Future requests: <b>${cs.n}</b></label><input id="method-calls" class="range" type="range" min="1" max="30" value="${cs.n}"><label class="row"><input id="method-expired" type="checkbox" ${cs.cacheExpired?'checked':''}> Old cache has expired</label></div><div class="method-result ${v>0?'':'waiting'}"><b>${fmt(v)} normalized cost units</b>${v>0?'Economics favor committing.':'Economics favor waiting.'}<p class="small" style="margin:8px 0 0">${cs.cacheExpired?'First-write saving + later read savings':'Later read savings − suffix rebuild premium'}<br>Read 0.1 · write 1.25 · additional commit cost 0</p></div></div><div class="timeline-boundary"><div>Snapshot</div><div>Plan + rehearsal</div><div class="${cs.commitState!=='Committed'?'now':''}">${cs.commitState==='Stale plan'?'Stale candidate':'Pending'}</div><div class="${cs.commitState==='Committed'?'now':''}">Safe commit</div></div><div class="row"><label class="row"><input id="method-busy" type="checkbox" ${cs.busy?'checked':''}> Tool still running</label><label class="row"><input id="method-new" type="checkbox" ${cs.newInstruction?'checked':''}> A new user constraint arrived</label></div><div class="interventions">${btn('try-commit','Try to commit the candidate',true)}</div>${cs.commitMessage?outcome(cs.commitState,cs.commitMessage,cs.commitState==='Committed'?'':cs.commitState==='Stale plan'?'failure':'waiting'):''}<p class="case-callout">This sandbox assumes the candidate is safe and the current context fits. Hard capacity can require a safe edit despite unfavorable economics. Planner costs already paid are not charged again on every retry. Geometry and prices are illustrative, not your provider’s billing.</p>`);}
const choices={repeat:{label:'Repeated tool output',problem:'The same unchanged file was read three times. No new semantics appeared.',right:'preprocess',why:'Exact identity and deterministic cleaning solve this problem before a model needs to reason about it.'},history:{label:'Too much obsolete history',problem:'A completed investigation left old logs and a disproven hypothesis inside the current request.',right:'gc',why:'Mark live dependencies, then fold, mask or prune eligible history at a safe boundary.'},question:{label:'A question about past evidence',problem:'The user asks why a decision changed last month. The relevant archive is available.',right:'retrieve',why:'Retrieve for the current intent, preserve required context and pack complete evidence.'},memory:{label:'Ambiguous future memory',problem:'A useful conversation says “she will do it tomorrow.” Next week that wording will be ambiguous.',right:'write',why:'Resolve the entity and date when source context is available, then index a self-contained fact.'},long:{label:'One relevant passage is too long',problem:'The right document is already selected, but optional prose exceeds the passage budget.',right:'compress',why:'Use constrained text compression after selection; protect exact constraints and validate meaning.'},outage:{label:'Retrieval becomes unavailable',problem:'The external retrieval service times out. Local original history remains accessible.',right:'fallback',why:'Use an in-place request with protected history and capacity checks. No external service does not mean no local storage.'}};
function sceneChoose(){const c=choices[cs.bottleneck],labels={preprocess:'Clean / deduplicate',gc:'Govern live history',retrieve:'Retrieve evidence',write:'Write-time memory',compress:'Compress selected text',fallback:'In-place fallback'};return sceneFrame('Diagnose first. Compose only what the problem needs.',`<div class="scenario-selector">${Object.entries(choices).map(([k,v])=>`<button data-method-problem="${k}" class="${cs.bottleneck===k?'active':''}">${v.label}</button>`).join('')}</div><div class="method-query">${c.problem}</div><p class="timing-label">What is the first useful intervention?</p><div class="interventions">${Object.entries(labels).map(([k,l])=>`<button data-method-choice="${k}" class="${cs.chosen===k?'active':''}">${l}</button>`).join('')}</div>${cs.judged?outcome(cs.chosen===c.right?'A good first intervention':'This does not address the first bottleneck',cs.chosen===c.right?c.why:`Start with “${labels[c.right]}”. ${c.why} Other methods can be added if a separate problem remains.`,cs.chosen===c.right?'':'failure'):''}<div class="matrix-route"><span class="route-node used">Preserve sources</span> → <span class="route-node ${cs.judged?'used':''}">${cs.judged?labels[c.right]:'Chosen intervention'}</span> → <span class="route-node">Check evidence & capacity</span> → <span class="route-node">Evaluate task outcome</span></div><h3>What counts as success?</h3><div class="shelf"><span>1. Stored<br><small>The source still exists</small></span><span>2. Found<br><small>Retrieval reaches it</small></span><span>3. Sent<br><small>It fits the request</small></span><span>4. Used correctly<br><small>The answer respects it</small></span></div><p class="content-note">These are four different gates. Compressing more does not prove that the last gate passed.</p><details><summary>After the task: what can a data flywheel actually produce?</summary><p>Clean successful paths while retaining necessary failed evidence and side-effect records. Create training candidates only from comparable states; do not leak a later answer into an earlier input. Cross-session patterns suggest hypotheses, not proven causes. Exporting a candidate does not train a model.</p></details>`);}
function chooseCase(i){caseIndex=i;cs=initialCaseState();setPage('studio');}
function bindMethodology(){document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>chooseCase(Number(b.dataset.case)));if(document.querySelector('[data-method-next]'))document.querySelector('[data-method-next]').onclick=()=>chooseCase((caseIndex+1)%cases.length);if(document.querySelector('[data-method-reset]'))document.querySelector('[data-method-reset]').onclick=()=>{cs=initialCaseState();render();};document.querySelectorAll('[data-method-reference]').forEach(b=>b.onclick=()=>{lessonIndex=Number(b.dataset.methodReference);lessonStep=0;setPage('learn');});
 document.querySelectorAll('[data-method-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.methodAction;
 if(a==='clean')cs.clean=true;if(a==='same-version')cs.changed=false;if(a==='changed-version')cs.changed=true;
 if(a==='fold-code'){cs.gc.code='fold';cs.gcBad=false;cs.gcMessage='The old code remains reachable through a recovery reference. This example needs it available for later comparison, not fully visible at this instant.';}
 if(a==='mask-log'){cs.gc.log='mask';cs.gcBad=false;cs.gcMessage='Only known repetitive progress is masked. An error stack or sparse diff would need different treatment.';}
 if(a==='prune-guess'){cs.gc.guess='prune';cs.gcBad=false;cs.gcMessage='The explicitly disproven hypothesis leaves the active window. It remains in the historical archive for audit.';}
 if(a==='prune-rule'){cs.gcBad=true;cs.gcMessage='The current task still depends on this rule. Removing it could allow duplicate charges. No view change is applied.';}
 if(a==='recover-code'){delete cs.gc.code;cs.gcBad=false;cs.gcMessage='The exact historical code returns to the active window. This is reading the old source, not re-executing the payment.';}
 if(a==='query-why'||a==='query-when'){cs.intent=a==='query-why'?'why':'when';}if(a==='retrieve')cs.retrieved=true;
 if(a==='write-memory')cs.written=true;if(a==='correct-memory')cs.corrected=true;
 if(a==='search-memory'){cs.memoryPage=1;cs.answered=false;}if(a==='heartbeat')cs.memoryPage=2;if(a==='pin-memory')cs.pinned=true;if(a==='answer-memory')cs.answered=true;if(a==='sleep-memory')cs.sleep=true;
 if(a==='compress-retry'||a==='compress-owner'){cs.question=a==='compress-retry'?'retry':'owner';cs.dropNot=false;}if(a==='compress')cs.compressed=true;if(a==='drop-negation'){cs.dropNot=true;cs.question='retry';}
 if(a==='early-edit'||a==='late-edit'){cs.edit=a==='early-edit'?'early':'late';cs.commitMessage='';}
 if(a==='try-commit'){const v=cs.cacheExpired?400*1.25+(cs.n-1)*400*.1:cs.n*400*.1-(cs.edit==='early'?600:100)*1.15;if(cs.newInstruction){cs.commitState='Stale plan';cs.commitMessage='The proposal was made before the new constraint. Discard this stale proposal and plan against the new task state.';}else if(cs.busy){cs.commitState='Wait for the tool boundary';cs.commitMessage='The candidate remains pending. Applying an edit while the tool is in flight is not allowed in this example.';}else if(v<=0){cs.commitState='Defer for cache economics';cs.commitMessage='No active context changes. Reevaluate this still-valid pending candidate later without necessarily calling the planner again.';}else{cs.commitState='Committed';cs.commitMessage='The candidate passes the illustrated timing and cost gates. Only now does the active view change; the original history remains.';}}
 render();});
 const bindings=[['method-slots','change',e=>cs.slots=Number(e.target.value)],['method-anchor','change',e=>{cs.anchor=e.target.checked;cs.written=false;cs.corrected=false;}],['method-calls','change',e=>{cs.n=Number(e.target.value);cs.commitMessage='';}],['method-expired','change',e=>{cs.cacheExpired=e.target.checked;cs.commitMessage='';}],['method-busy','change',e=>{cs.busy=e.target.checked;cs.commitMessage='';}],['method-new','change',e=>{cs.newInstruction=e.target.checked;cs.commitMessage='';}]];
 bindings.forEach(([id,event,fn])=>{if($(id))$(id).addEventListener(event,e=>{fn(e);render();if(event==='input')$(id)?.focus();});});
 document.querySelectorAll('[data-method-problem]').forEach(b=>b.onclick=()=>{cs.bottleneck=b.dataset.methodProblem;cs.chosen='';cs.judged=false;render();});document.querySelectorAll('[data-method-choice]').forEach(b=>b.onclick=()=>{cs.chosen=b.dataset.methodChoice;cs.judged=true;render();});
}

selectRuns();render();
</script>
